<!DOCTYPE html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="/gbpmobile/" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="description" content="gbpmobile project." />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta
            name="apple-mobile-web-app-title"
            content="Banko Tahminler - İddaa Analiz"
        />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Banko Tahminler - İddaa Analiz</title>
        <link rel="manifest" href="manifest.json" />
    </head>
    <body>
        <div
            id="loading"
            style="
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: #1a1a2e;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: sans-serif;
                color: white;
            "
        >
            <div style="font-size: 24px; margin-bottom: 20px">GBP Mobile</div>
            <div id="status" style="font-size: 14px; color: #888">
                Yükleniyor...
            </div>
            <div
                id="error"
                style="
                    font-size: 12px;
                    color: #ff6b6b;
                    margin-top: 10px;
                    max-width: 80%;
                    text-align: center;
                "
            ></div>
        </div>

        <script>
            function log(msg) {
                console.log('[GBP] ' + msg);
                var status = document.getElementById('status');
                if (status) status.textContent = msg;
            }

            function showError(msg) {
                console.error('[GBP ERROR] ' + msg);
                var error = document.getElementById('error');
                if (error) error.textContent = msg;
            }

            window.onerror = function (msg, url, line, col, error) {
                showError('JS Error: ' + msg + ' at ' + url + ':' + line);
                return false;
            };

            window.addEventListener('unhandledrejection', function (event) {
                showError('Promise Error: ' + event.reason);
            });

            log('HTML loaded, starting Flutter...');
        </script>

        <script
            src="flutter_bootstrap.js"
            async
            onload="log('Flutter bootstrap loaded')"
            onerror="showError('flutter_bootstrap.js yüklenemedi!')"
        ></script>
    </body>
</html>
